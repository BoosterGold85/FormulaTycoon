<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Phone-first: no pinch/double-tap zoom so taps go to the game. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0A111B" />
    <!-- Lets iPhone "Add to Home Screen" open full screen like an app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="F. Tycoon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Formula Tycoon</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0a111b;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Formula Tycoon.</noscript>
    <div id="root"></div>
  </body>
</html>
